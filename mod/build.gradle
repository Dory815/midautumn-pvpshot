plugins {
    // 26.x 起 Minecraft jar 已是官方命名，不再需要 mappings/remap。
    // 已发布的 1.17.20 / 1.17.21 / 1.18.2 都还强制要求 mappings
    // （报 "Configuration 'mappings' has no dependencies"）；
    // Fabric 官方示例模组使用的是滚动快照 1.17-SNAPSHOT，它支持这种"无映射"模式。
    // 该版本由 Gradle 9.7.0 系列构建，本工程配套 Gradle 9.7.1。
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // 本地 Maven 仓库：由 make-local-maven.ps1 把 libs/ 里的第三方模组摆成
    // local:carpet / local:spark / local:eco 三个坐标，供下面的 include 使用。
    maven { url = uri("libs/repo") }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x 起 Minecraft 的 jar 本身就是官方命名（已核实：client/server jar 内是
    // net/minecraft/server/level/ServerPlayer 这样的名字），官方 version json 里不再
    // 提供 client_mappings，Yarn 也没有 26.x 版本。
    // 因此：不写 mappings 行，依赖用普通 implementation（不需要 remap）。
    // 这与 Fabric 官方示例模组的写法一致（fabric-example-mod 的 build.gradle 中
    // 既没有 mappings 也没有 modImplementation）。
    // 好处：现有 server_protection 代码用的官方类名可以原样复用。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ---- 一体化打包（jar-in-jar）----
    // 目的：部署时 mods/ 里只放 **一个** pvpshot jar。
    // Fabric Loader 会在启动时把 jar 里的 META-INF/jars/*.jar 解出来单独加载。
    //
    // Fabric API 走 Loom 的 include（它是标准 Maven 坐标，Loom 能识别）。
    // 另外三个来自本地 Maven 仓库（见 make-local-maven.ps1）：必须是"模块坐标"
    // Loom 才认；直接 include files(...) 会报 not a module component。
    //
    // 注意：Fabric 只会加载 fabric.mod.json 的 jars 列表里声明的嵌套 jar，
    // 手工往 META-INF/jars/ 塞文件是无效的（试过，Loader 直接忽略）。
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include "local:carpet:26.2"
    include "local:spark:1.10.187"
    include "local:eco:1.0.0"
    // 以下 5 个来自作者客户端的同版本模组（env=*，带服务端组件）：
    include "local:ferritecore:9.0.0"
    include "local:appleskin:3.0.10"
    include "local:xaerominimap:26.5.1"
    include "local:xaeroworldmap:1.46.1"
    include "local:placeholderapi:3.1.0-beta.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    // 不生成 sources jar：26.x 的恒等映射下，Loom 重映射依赖 sources 会失败
    // （Failed to remap sources for ...fabric-api-...-sources.jar）。
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
